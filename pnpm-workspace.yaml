packages:
  - apps/*
  - services/*
  - workers/*
  - packages/*
  - sdk/*

confirmModulesPurge: false

allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true

onlyBuiltDependencies:
  - esbuild
  - sharp
  - unrs-resolver

overrides:
  sharp: ">=0.35.0"
  postcss: ">=8.5.18"
  drizzle-orm: ">=0.45.2"
  nanoid: ">=3.3.18"
