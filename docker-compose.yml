services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: growx
      POSTGRES_USER: growx
      POSTGRES_PASSWORD: growx
    ports: ["55432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U growx -d growx"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:8-alpine
    ports: ["6379:6379"]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres-data:
  redis-data:
